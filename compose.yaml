name: sitrah
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sitrah
      POSTGRES_USER: sitrah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitrah-local-db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitrah -d sitrah"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitrah-local-db}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-sitrah-desarrollo-local-no-produccion}
      SITRAH_DEMO: ${SITRAH_DEMO:-1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - documentos:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "python manage.py migrate --noinput; if [ \"$$SITRAH_DEMO\" = 1 ]; then python manage.py demo; fi; exec gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 2"]
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
volumes:
  pgdata:
  documentos:
